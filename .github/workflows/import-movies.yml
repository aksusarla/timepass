# Adds new draft movies from a CSV in supabase/imports/ (never overwrites
# existing rows), then the next Content sync brings them to the site.
name: Import movies

on:
  workflow_dispatch:
    inputs:
      file:
        description: CSV in supabase/imports/
        required: true

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://zbrzrbiegwqpajetdftk.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FILE: ${{ inputs.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import
        run: |
          case "$FILE" in supabase/imports/*.csv) ;; *) echo "::error::Pick a CSV inside supabase/imports/"; exit 1;; esac
          node scripts/supabase-import.mjs "$FILE"
