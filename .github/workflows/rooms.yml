# Deploys the online room server (rooms/) to Cloudflare Workers.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; until
# they exist this job only reports that it skipped. After the first deploy,
# set repo variable ROOMS_URL to the printed workers.dev address and re-run
# "Deploy to GitHub Pages" to switch online mode on in the site.
name: Deploy room server

on:
  push:
    branches: [main]
    paths:
      - "rooms/**"
      - "src/lib/rooms.ts"
      - "src/lib/game.ts"
      - "src/lib/selection.ts"
      - "data/content-bank/**"
      - ".github/workflows/rooms.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rooms
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the room server."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Build content (puzzles bundled into the server)
        if: steps.secrets.outputs.skip != '1'
        run: node scripts/build-content.mjs
      - name: Deploy
        if: steps.secrets.outputs.skip != '1'
        working-directory: rooms
        run: |
          npm ci
          npx tsc --noEmit -p .
          npx wrangler deploy
