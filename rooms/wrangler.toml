# Timepass room server (online mode). Deployed by .github/workflows/rooms.yml.
name = "timepass-rooms"
main = "worker.ts"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Sites allowed to open rooms (comma separated).
ALLOWED_ORIGINS = "https://aksusarla.github.io,http://localhost:3000,http://localhost:4310"
